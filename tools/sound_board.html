<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graduation card sound board</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    html, body { height: auto; overflow: visible; color-scheme: dark; }
    main { width: min(calc(100% - 32px), 36rem); margin: 32px auto; }
    h1 { margin: 16px 0; font: 600 clamp(1.4rem, 5vw, 2rem)/1.3 var(--mono); }
    a { color: var(--muted); }
    .level { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .level output { min-width: 4ch; font-variant-numeric: tabular-nums; }
    ul { list-style: none; padding: 0; margin: 24px 0; }
    li { border-bottom: 1px solid var(--line); }
    li:first-child { border-top: 1px solid var(--line); }
    li button {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      width: 100%; min-height: 44px; padding: 6px 8px; text-align: left;
      background: var(--bg); border: 0; color: var(--ink);
    }
    li button:hover { background: #141414; }
    li button span { color: var(--muted); font: .85rem var(--mono); }
  </style>
</head>
<body>
  <main>
    <a href="../">Back to the card</a>
    <h1>Graduation card sounds</h1>
    <div class="level">
      <label for="volume">Volume</label>
      <input id="volume" class="volume-slider" type="range" min="0" max="100">
      <output id="percent" for="volume" aria-hidden="true"></output>
    </div>
    <p id="disabled" hidden>Sound effects are disabled in js/config.js.</p>
    <ul id="cues" aria-label="Sound effects"></ul>
  </main>
  <script type="module">
    import { cardConfig } from '../js/config.js';
    import { sfx } from '../js/sfx.js';

    const labels = {
      open: 'Open the card',
      tap: 'Button tap',
      correct: 'Correct answer',
      wrong: 'Incorrect answer',
      page: 'Turn a page',
      bloom: 'Congratulations reveal',
      dodge: 'Runaway answer',
      switch: 'Switch bouquet',
    };
    const volume = document.getElementById('volume');
    const percent = document.getElementById('percent');
    const list = document.getElementById('cues');

    function updateVolume() {
      const value = `${volume.value}%`;
      volume.style.setProperty('--fill', value);
      volume.setAttribute('aria-valuetext', value);
      percent.textContent = value;
      sfx.setLevel(Number(volume.value) / 100);
    }

    volume.value = Math.round((cardConfig.music.volume ?? 0.15) * 100);
    volume.addEventListener('input', updateVolume);
    updateVolume();

    if (!cardConfig.sfx.enabled) {
      volume.disabled = true;
      document.getElementById('disabled').hidden = false;
    }

    for (const name of sfx.names) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      const action = document.createElement('span');
      button.type = 'button';
      button.disabled = !cardConfig.sfx.enabled;
      button.textContent = labels[name] ?? name;
      action.textContent = 'Play';
      action.setAttribute('aria-hidden', 'true');
      button.append(action);
      button.addEventListener('click', () => {
        sfx.unlock();
        sfx.play(name);
      });
      item.append(button);
      list.append(item);
    }
  </script>
</body>
</html>
